name: Check freeze file sizes

on:
  pull_request:
    paths:
      - "_freeze/**"
      - ".github/workflows/check-freeze-file-sizes.yml"

  push:
    branches:
      - main
    paths:
      - "_freeze/**"

env:
  MAX_FREEZE_FILE_SIZE_MB: 50

jobs:
  check-freeze-file-sizes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check files in _freeze
        shell: bash
        run: |
          max_size=$((MAX_FREEZE_FILE_SIZE_MB * 1024 * 1024))
          failed=0

          if [ ! -d "_freeze" ]; then
            echo "_freeze directory does not exist; nothing to check."
            exit 0
          fi

          while IFS= read -r -d '' file; do
            size=$(stat --format=%s "$file")

            if [ "$size" -gt "$max_size" ]; then
              size_mb=$(awk "BEGIN {printf \"%.2f\", $size / 1024 / 1024}")
              echo "::error file=$file::$file is ${size_mb} MiB; maximum allowed size is ${MAX_FREEZE_FILE_SIZE_MB} MiB."
              failed=1
            fi
          done < <(find _freeze -type f -print0)

          exit "$failed"